services:
  auth-db:
    image: alpine:latest
    container_name: kma_auth_sqlite_server
    restart: unless-stopped
    volumes:
      - ./auth_db_data:/db
    working_dir: /db
    stdin_open: true
    tty: true
    command: >
      /bin/sh -c "
      apk add --no-cache sqlite &&
      touch /db/auth.sqlite &&
      tail -f /dev/null"
    networks:
      - kma_network

  auth-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kma_auth_backend
    restart: unless-stopped
    # Not published to the host by default — nginx reaches this
    # container over the internal kma_network via its container name
    # (see nginx.conf's /auth/ location), so the browser never talks
    # to :8001 directly. Uncomment below only if you need to hit it
    # straight from your machine for local debugging.
    # ports:
    #   - "8001:8001"
    volumes:
      - ./auth_db_data:/app/db_data
    depends_on:
      - auth-db
    env_file:
      - ./.env
    networks:
      - kma_network

  auth-backup:
    image: alpine:latest
    container_name: kma_auth_backup
    restart: unless-stopped
    # Alpine's busybox crond forks a child per job and that child calls
    # setpgid() on itself — which fails with "Operation not permitted"
    # when crond is running as the container's PID 1 (no real init
    # process ever reaps/owns process groups the way a normal init
    # would). That failure was killing crond immediately after start,
    # which crashed this container's whole command and put it in a
    # restart loop — taking a fresh ad-hoc backup on every restart
    # instead of on the crontab's actual schedule. `init: true` gives the container
    # a proper PID 1 (Docker's built-in tini) so crond runs as a normal
    # child process instead.
    init: true
    # Same backup.sh as the main kma stack — copy that file (and
    # crontab) into this project's ./backup folder too. Read-only mount
    # on the source DB for the same reason as the main stack: this
    # container should never be able to write into auth_db_data.
    volumes:
      - ./auth_db_data:/db:ro
      - ./auth_backups:/backups
      - ./backup/backup.sh:/backup.sh:ro
      - ./backup/crontab:/etc/crontabs/root:ro
    environment:
      DB_FILENAME: "auth.sqlite"
      BACKUP_PREFIX: "auth"
      # Losing this DB means nobody can log in at all — a stricter
      # retention than the main data stack isn't really warranted, but
      # feel free to raise this if you want more restore points.
      BACKUP_RETENTION_DAYS: "30"
    # backup.sh is mounted :ro on purpose (this container should never
    # be able to modify the script that runs against the DB) — invoked
    # via `sh backup.sh` rather than executed directly, so it never
    # needs its executable bit set. `chmod +x` here would fail outright
    # on a read-only bind mount and crash-loop the container without
    # ever taking a single backup.
    command: >
      /bin/sh -c "
      apk add --no-cache sqlite dcron &&
      sh /backup.sh &&
      crond -f -l 2"
    networks:
      - kma_network

networks:
  # This stack does NOT own the network — your backend stack's
  # docker-compose.yaml already creates kma_network. Every other
  # stack (frontend, and now this one) just joins it, same as your
  # existing frontend compose file already does.
  kma_network:
    external: true
    name: kma_network